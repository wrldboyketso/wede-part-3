<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Maka Nana Shisanyama</title>
    <meta name="description" content="Create a demo Maka Nana Shisanyama account in your browser.">
    <meta name="keywords" content="Maka Nana account, sign up, Durban food account">
    <link rel="stylesheet" href="css/style.css?v=20261028-1">
</head>
<body>
    <header class="site-header">
        <a class="brand-logo" href="index.html" aria-label="Maka Nana Shisanyama home"><img src="images/maka-nana-logo.jpg" alt="Maka Nana Shisanyama logo"></a>
        <nav class="site-nav"><a href="menu.html">Menu</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
        <div class="header-actions"><a class="account-link" href="register.html">Sign in/up</a><a class="cart-link" href="cart.html" aria-label="Open cart">Cart <span class="cart-count">0</span></a></div>
    </header>
    <main>
        <section>
            <h2>Create account</h2>
            <p>This is a student demo. Your account is saved in this browser only. Do not use a real password.</p>
            <form id="register-form" novalidate>
                <label for="register-name">Full name</label>
                <input id="register-name" type="text" autocomplete="name" required>
                <small class="form-error" id="register-name-error"></small>

                <label for="register-phone">Phone number</label>
                <input id="register-phone" type="tel" inputmode="tel" placeholder="e.g. 071 840 5670" autocomplete="tel" required>
                <small class="form-error" id="register-phone-error"></small>

                <label for="register-email">Email address</label>
                <input id="register-email" type="email" autocomplete="email" required>
                <small class="form-error" id="register-email-error"></small>

                <label for="register-password">Create demo password</label>
                <input id="register-password" type="password" minlength="6" autocomplete="new-password" required>
                <small class="form-error" id="register-password-error"></small>

                <label for="register-confirm-password">Confirm demo password</label>
                <input id="register-confirm-password" type="password" minlength="6" autocomplete="new-password" required>
                <small class="form-error" id="register-confirm-password-error"></small>

                <button type="submit">Create demo account</button>
            </form>
            <p id="register-result" class="form-result" aria-live="polite"></p>
            <p class="account-helper">Already have a demo account? <a href="signin.html">Sign in</a>.</p>
        </section>
    </main>
    <footer><p>Phone / WhatsApp: +27 71 840 5670</p><p>Find us near Spar, Durban, KwaZulu-Natal</p></footer>
    <script src="js/script.js?v=20261028-2"></script>
</body>
</html>
