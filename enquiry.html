<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout and Payment | Maka Nana Shisanyama</title>
    <meta name="description" content="Complete a demo Maka Nana Shisanyama checkout for collection or delivery in Durban.">
    <meta name="keywords" content="Maka Nana checkout, demo payment, food delivery, Durban order">
    <link rel="stylesheet" href="css/style.css?v=20261028-1">
</head>
<body>
    <header class="site-header">
        <a class="brand-logo" href="index.html"><img src="images/maka-nana-logo.jpg" alt="Maka Nana Shisanyama logo"></a>
        <nav class="site-nav"><a href="menu.html">Menu</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
        <div class="header-actions"><a class="account-link" href="register.html">Sign in/up</a><a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a></div>
    </header>

    <main>
        <section>
            <h2>Checkout and payment</h2>
            <p>This is a student demo. It does not take real money or send a real food order.</p>
            <p id="checkout-account-message" class="form-result" aria-live="polite"></p>
            <form id="enquiry-form" novalidate>
                <label for="enquiry-name">Full name</label>
                <input id="enquiry-name" type="text" autocomplete="name" required>
                <small class="form-error" id="enquiry-name-error"></small>

                <label for="enquiry-phone">Phone number</label>
                <input id="enquiry-phone" type="tel" inputmode="tel" placeholder="e.g. 071 840 5670" required>
                <small class="form-error" id="enquiry-phone-error"></small>

                <label for="enquiry-email">Email address</label>
                <input id="enquiry-email" type="email" autocomplete="email" required>
                <small class="form-error" id="enquiry-email-error"></small>

                <label for="delivery-method">Delivery or collection</label>
                <select id="delivery-method" required>
                    <option value="">Choose one</option>
                    <option value="Delivery">Delivery</option>
                    <option value="Collection">Collection</option>
                </select>
                <small class="form-error" id="delivery-method-error"></small>

                <div id="location-field" hidden>
                    <label for="location">Delivery address</label>
                    <input id="location" type="text" placeholder="Enter your delivery address">
                    <small class="form-error" id="location-error"></small>
                </div>

                <label for="order-message">Meals in your cart</label>
                <textarea id="order-message" rows="5" readonly></textarea>
                <small class="form-error" id="order-message-error"></small>

                <div id="card-field">
                    <h3>Card payment</h3>
                    <p>Use test details only. Do not enter a real bank card.</p>
                    <label for="card-name">Name on test card</label>
                    <input id="card-name" type="text" autocomplete="off">
                    <small class="form-error" id="card-name-error"></small>

                    <label for="card-number">Test card number</label>
                    <input id="card-number" type="text" inputmode="numeric" placeholder="1111 2222 3333 4444" autocomplete="off">
                    <small class="form-error" id="card-number-error"></small>

                    <label for="card-expiry">Test expiry date</label>
                    <input id="card-expiry" type="text" inputmode="numeric" placeholder="MM/YY" autocomplete="off">
                    <small class="form-error" id="card-expiry-error"></small>

                    <label for="card-cvv">Test CVV</label>
                    <input id="card-cvv" type="password" inputmode="numeric" placeholder="123" autocomplete="off">
                    <small class="form-error" id="card-cvv-error"></small>
                </div>

                <button type="submit">Complete demo checkout</button>
            </form>
            <p id="enquiry-result" class="form-result" aria-live="polite"></p>
        </section>
    </main>

    <footer><p>Phone / WhatsApp: +27 71 840 5670</p><p>Find us near Spar, Durban, KwaZulu-Natal</p></footer>
    <script src="js/script.js?v=20261028-3"></script>
</body>
</html>
